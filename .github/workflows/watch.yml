name: Ticket watcher

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub's minimum; may run late)
  workflow_dispatch:           # adds a "Run workflow" button for manual runs
    inputs:
      test_notify:
        description: "Only send a test push notification"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job commit state.json

concurrency:
  group: ticket-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Check tickets
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '0' }}
        run: python check.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "ticket-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update ticket state"
            git push
          fi
